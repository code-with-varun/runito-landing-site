<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">

    <defs>
      <!-- Modern Primary Gradient: Electric Red to Neon Violet to Cyan -->
      <linearGradient id="runitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF2E54" />
        <stop offset="50%" stop-color="#9333EA" />
        <stop offset="100%" stop-color="#06B6D4" />
      </linearGradient>
      
      <!-- Text Accent Gradient -->
      <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF3B5C" />
        <stop offset="100%" stop-color="#A855F7" />
      </linearGradient>
      
      <!-- Glow Filter -->
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      
      <!-- Drop Shadow Filter -->
      <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
      </filter>
    </defs>

<rect width="100%" height="100%" fill="#0B0F19" rx="16"/>
  <g transform="translate(85, 80) scale(1.4)">
    <path d="M 15 15 C 35 0, 75 0, 90 25 C 105 50, 90 75, 65 75 L 42 75 L 42 95 L 22 95 L 22 15 Z" fill="url(#runitGradient)" filter="url(#dropShadow)" />
    <path d="M 42 25 L 62 25 C 72 25, 72 50, 62 50 L 42 50 Z" fill="#0B0F19" />
    <path d="M 45 60 L 78 95 L 56 95 L 32 68 Z" fill="url(#textGradient)" />
    <circle cx="88" cy="24" r="5" fill="#00F2FE" filter="url(#glow)" />
  </g>
</svg>